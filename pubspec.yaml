name: rafeeqa
description: "A little support for the biggest journey."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/appLogo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFF5F7"
  adaptive_icon_foreground: "assets/images/appLogo.png"
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  android: true
  ios: true
  color: "#FFF5F7"
  image: assets/images/appLogo.png
  fullscreen: true
  android_12:
    color: "#FFF5F7"
    image: assets/images/appLogo.png
    icon_background_color: "#FFF5F7"
flutter_intl:
  enabled: true
